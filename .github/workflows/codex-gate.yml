# Issue #46: judge Codex review evidence for every PR head and publish it as the commit
# status `codex-gate` on that head SHA. Every trigger below runs the workflow and script
# from the default branch; pull-request code is never checked out or executed here.
# A new push leaves the new head without a `codex-gate` status, so stale evidence cannot pass.
name: codex-gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [test]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (empty = all open PRs to main)'
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

concurrency:
  group: codex-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr || github.event_name }}
  cancel-in-progress: false

jobs:
  gate:
    # issue_comment: only the Codex bot's summary comment on a pull request re-triggers the gate.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       contains(github.event.comment.body, 'codex-pull-request-review-summary'))
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # Default-branch checkout only (no ref input): the judging code cannot be changed by the PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Judge and publish codex-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_GATE_THUMBS_RETRIES: ${{ github.event_name == 'issue_comment' && '6' || '0' }}
          PR_NUMBERS: >-
            ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr ||
            join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: python -X utf8 ci/codex_gate.py $PR_NUMBERS
