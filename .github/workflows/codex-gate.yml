# Issue #46: judge Codex review evidence for every PR head and publish it as the commit
# status `codex-gate` on that head SHA. Every trigger below runs the workflow and judging
# code from the default branch (main); pull-request code is never checked out or executed.
# There is deliberately no workflow_dispatch: a manual run can pick another branch's
# workflow and judging code. A new push leaves the new head without a `codex-gate`
# status, so stale evidence cannot pass.
#
# Every trigger judges each PR in the same per-PR concurrency group (codex-gate-pr-<n>),
# so two judgements of one PR never run at the same time and the later run writes last.
name: codex-gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [test]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

jobs:
  targets:
    # Runs only from the default branch ref. For issue_comment, only the Codex bot's summary
    # comment on a pull request re-triggers the gate.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.comment.body, 'codex-pull-request-review-summary')))
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    defaults:
      run:
        shell: bash
    steps:
      # The judging code always comes from main, whatever the event.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: List PRs to judge (event PR numbers, else every open PR to main, all pages)
        id: list
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBERS: >-
            ${{ github.event.pull_request.number || github.event.issue.number ||
            join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: echo "prs=$(python -X utf8 ci/codex_gate.py --list-targets $PR_NUMBERS)" >> "$GITHUB_OUTPUT"

  gate:
    needs: targets
    if: needs.targets.outputs.prs != '' && needs.targets.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.targets.outputs.prs) }}
    concurrency:
      group: codex-gate-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Judge and publish codex-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_GATE_THUMBS_RETRIES: ${{ github.event_name == 'issue_comment' && '6' || '0' }}
        run: python -X utf8 ci/codex_gate.py ${{ matrix.pr }}
