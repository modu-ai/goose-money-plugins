# Issue #16: build, test and secret-scan the plugin on macOS and Windows.
# Linux is intentionally not tested (server/scripts/test-desktop.mjs allows darwin and win32 only).
# No secrets are used; provider calls stay disabled because no credentials exist on the runner.
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Keep checked-out bytes identical on Windows; several tests pin file digests.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: plugins/moai-atp/server/.nvmrc
          cache: npm
          cache-dependency-path: plugins/moai-atp/server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install contract-test Python dependency
        run: python -m pip install -r plugins/moai-atp/server/requirements-contract-tests.txt

      - name: Install server dependencies
        working-directory: plugins/moai-atp/server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test
        working-directory: plugins/moai-atp/server
        run: npm test

      - name: Package component checks
        working-directory: plugins/moai-atp
        run: python scripts/check_package.py

      - name: Secret scan of the checked-out tree
        working-directory: plugins/moai-atp
        run: python scripts/check_secrets.py --staged
